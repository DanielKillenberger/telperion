[package]
name = "telperion-field"
version = "0.1.0"
edition = "2021"
license = "MIT"

# The slim binding: the core's build pipeline asked for the field alone, and
# nothing that serializes. A species id and a seed are the whole request.
# The geometry feature carries the pipeline and, for a family the leaf plan
# cannot describe, the leaf placement its field reads.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
telperion-core = { path = "../telperion-core", default-features = false, features = ["geometry"] }
