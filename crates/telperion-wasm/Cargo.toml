[package]
name = "telperion-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# One thread in Wasm: the core without its thread pool (fn-366, lever c).
telperion-core = { path = "../telperion-core", default-features = false, features = ["geometry", "json"] }
serde_json = "1"

[dev-dependencies]
# The pipeline boundary's compile-fail test (tests/boundary.rs).
trybuild = "1"
