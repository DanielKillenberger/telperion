[package]
name = "telperion-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The binding without the kept-phytomer refusal, for `scripts/wasm-ceiling.mjs`
# alone; the shipped module is never built with it.
measure-ceiling = ["telperion-core/measure-ceiling"]

[dependencies]
telperion-core = { path = "../telperion-core", features = ["json"] }
serde_json = "1"

[dev-dependencies]
# The pipeline boundary's compile-fail test (tests/boundary.rs).
trybuild = "1"
