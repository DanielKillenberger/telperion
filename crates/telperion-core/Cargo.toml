[package]
name = "telperion-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
json = ["dep:serde", "dep:serde_json", "dep:bincode", "slotmap/serde"]

[dependencies]
libm = { version = "=0.2.16", default-features = false }
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
bincode = { version = "=1.3.3", optional = true }
slotmap = "=1.1.1"

[[test]]
name = "foundation"
path = "../../tests/migration/foundation.rs"

[dev-dependencies]
# float_roundtrip: without it serde_json's fast path parses a seventeen-digit
# decimal a bit-off, and the catalogue's identity pins are compared bit for bit
# against the same literals in test source.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Examples and tests read the wire the binding publishes, never a second copy.
telperion-core = { path = ".", features = ["json"] }
