[package]
name = "telperion-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
json = ["dep:serde", "dep:serde_json"]

[dependencies]
libm = { version = "=0.2.16", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
slotmap = "=1.1.1"

[[test]]
name = "foundation"
path = "../../tests/migration/foundation.rs"

[dev-dependencies]
serde_json = "1"
# Examples and tests read the wire the binding publishes, never a second copy.
telperion-core = { path = ".", features = ["json"] }
