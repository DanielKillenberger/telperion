[package]
name = "telperion-jev"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared Jev caller, ledger and evidence tools. Never a dependency of core, render or wasm."

[[bin]]
name = "jev"
path = "src/bin/jev.rs"

[[bin]]
name = "species-pipeline"
path = "src/bin/species_pipeline.rs"

[[bin]]
name = "tuning-loop"
path = "src/bin/tuning_loop.rs"

[dependencies]
regex = "1"
# The capability gate reads the generator's declared vocabulary in process, so
# the version it records is the one this build compiled against. The edge runs
# this way only: core never names this crate (src/isolation.rs).
telperion-core = { path = "../telperion-core", features = ["json"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: the pipeline reads back the canonical artifacts it wrote and
# compares their numbers, so a parse has to return the double that was written.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
ureq = { version = "2.12", default-features = true, features = ["native-certs"] }
