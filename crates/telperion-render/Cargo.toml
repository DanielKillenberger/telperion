[package]
name = "telperion-render"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
telperion-core = { path = "../telperion-core" }
# The GPU executor settles a tree's fine roots as the engine's `Roots`
# (fn-212 task 10), on the engine's own tables.
telperion-space = { path = "../telperion-space" }
wgpu = "30"
# The scene row is stated as JSON by the command line and by the page alike,
# so its parser is the renderer's own dependency rather than the browser's.
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }
futures-channel = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"
# The driver's device-memory budget (VK_EXT_memory_budget), read through
# wgpu's own Vulkan device: what other processes leave of the card bounds
# a native build (fn-256 task 5). The version wgpu-hal uses.
ash = "0.38"
png = "0.18"

# The browser target parses the panel's parameter JSON in Rust, so the schema
# the binding publishes is the schema the renderer reads. The wasm-bindgen
# version is exact because the CLI that generates the glue must match it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
telperion-core = { path = "../telperion-core", features = ["json"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window"] }

[dev-dependencies]
# The conformance sweep reads the shipped families as JSON and walks them; the
# renderer library itself never sees a parameter name.
telperion-core = { path = "../telperion-core", features = ["json"] }
wgpu = "30"
# The pipeline boundary's compile-fail test (tests/boundary.rs).
trybuild = "1"
# Every shipped shader parsed and validated without a GPU, under the
# capabilities wgpu grants the device (src/shader_tests.rs).
naga = { version = "30", features = ["wgsl-in"] }
wgpu-naga-bridge = "30"
