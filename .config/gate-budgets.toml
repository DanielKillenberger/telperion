# The gate's budget allowlist (host, fn-304 R4). A test's own time is at most
# 60 s and its peak resident memory at most 4 GiB on the declared invocation
# (AGENTS.md, "Gates and checked claims"). A test over either is listed here
# with the budget it is held to and the figures it was measured at: a quarter
# more time than measured, rounded up to 5 s, and a tenth more memory,
# rounded up to 64 MiB. `scripts/gate.py` refuses a new entry, a raised
# figure or an entry for a test the gate no longer runs: this list only
# shrinks. Keys are the test binary's name and the test's name.

