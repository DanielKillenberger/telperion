# The gate's budget allowlist (host, fn-304 R4, ruled 2026-10-22). On the
# declared invocation (AGENTS.md, "Gates and checked claims") a test's own
# wall time is cut off at 120 s, twice the 60 s budget for the desk's 2x
# swing between runs, and its peak resident memory may reach 4 GiB. A test
# whose worst completed time across fn-304's recorded runs passed 60 s is
# held to twice that time; one whose worst peak passed 4 GiB is held to a
# tenth more, rounded up to 64 MiB. `measured` keeps the worst figures.
# `scripts/gate.py` refuses a new entry, a raised figure or an entry for a
# test the gate no longer runs: this list only shrinks. Keys are the test
# binary's name and the test's name.

