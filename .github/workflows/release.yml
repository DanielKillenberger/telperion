name: Release

# A green Tests run on a master push releases the commit it tested when that
# commit's package.json version is not on npm yet. This workflow reads that
# commit (the run's head_sha, never master's tip), checks every suite of the
# run, publishes the tarball the run built and tested, and builds nothing.
# A version already on npm publishes nothing. A version below npm's latest,
# a v<version> tag on another commit, a suite with neither a green job nor a
# receipt, and a missing or altered tarball each refuse before anything is
# written. The tag is pushed before the publish, so a rerun after a failed
# publish finds its own tag and converges.
#
# The publish authenticates by npm trusted publishing: the job's OIDC token
# (id-token: write, npm 11.5.1 or later, Node 22.14 or later) under the
# trusted publisher configured on npmjs.com for this repository and this
# workflow file. No npm token is stored or set. Provenance binds the tarball
# to this workflow run.
#
# A dispatch of this workflow (gh workflow run release.yml -r <branch>) runs
# only the prerelease job: it builds the dispatched commit and publishes it
# as <version>-next.<YYYYMMDD>.<short sha> under the dist-tag next, through
# the same trusted publisher (docs/prerelease.md). The publish job needs a
# workflow_run event, so a dispatch never starts it, and a prerelease never
# touches latest.
on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pack and run npm publish --dry-run; nothing is published
        type: boolean
        default: false

permissions:
  contents: read

# A dispatch queues apart from releases: in one group, a pending release
# would be replaced by a later pending dispatch and never run.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'prerelease' || 'release' }}
  cancel-in-progress: false

jobs:
  publish:
    # branches matches a head branch name, which a fork can also carry, so the
    # run must be a push to this repository.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      actions: read
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - id: version
        name: Decide whether the tested commit publishes
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          versions=$(npm view telperion versions --json)
          latest=$(npm view telperion dist-tags.latest)
          on_npm=$(node -p '[].concat(JSON.parse(process.argv[1])).includes(process.argv[2])' "$versions" "$version")
          tagged=$(git ls-remote --tags origin | awk -v t="refs/tags/$tag" '$2 == t "^{}" { p = $1 } $2 == t { l = $1 } END { print p ? p : l }')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$on_npm" = true ]; then
            echo "$version is already on npm; nothing is published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "::error::$version is lower than npm's latest $latest; nothing is published"
            exit 1
          fi
          if [ -n "$tagged" ] && [ "$tagged" != "$HEAD_SHA" ]; then
            echo "::error::$tag already names $tagged, not $HEAD_SHA; nothing is published"
            exit 1
          fi
          echo "$version is new (npm's latest is $latest); $HEAD_SHA publishes it."
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tagged=${tagged:+true}" >> "$GITHUB_OUTPUT"

      # A suite is green for the commit when its jobs in the Tests run
      # succeeded, or were skipped because its receipt (scripts/ci-key.mjs on
      # this commit) is in master's cache. There is no fallback run.
      - if: steps.version.outputs.publish == 'true'
        name: Every suite is green for the tested commit
        run: |
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | [.name, .conclusion] | @tsv')
          refused=0
          while read -r suite pattern; do
            conclusions=$(awk -F'\t' -v p="$pattern" '$1 ~ p { print $2 }' <<< "$jobs" | sort -u | xargs)
            if [ "$conclusions" = success ]; then
              echo "$suite: green by run."
              continue
            fi
            if [ "$conclusions" = skipped ] && [ "$suite" != package ]; then
              key=$(node scripts/ci-key.mjs "$suite")
              found=$(gh api "repos/$GITHUB_REPOSITORY/actions/caches?key=$key&ref=refs/heads/master" \
                --jq "[.actions_caches[] | select(.key == \"$key\")] | length")
              if [ "$found" != 0 ]; then
                echo "$suite: green by receipt $key."
                continue
              fi
            fi
            echo "::error::$suite has no green job and no receipt for $HEAD_SHA (jobs: ${conclusions:-none}); nothing is published"
            refused=1
          done <<'EOF'
          rust-core ^core
          rust-render ^render$
          rust-wasm ^wasm, field and jev$
          rust-jev ^wasm, field and jev$
          node ^node$
          package ^package$
          EOF
          exit "$refused"

      - if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - if: steps.version.outputs.publish == 'true'
        name: The tarball is the one the Tests run tested
        working-directory: ${{ runner.temp }}/package
        env:
          TARBALL: telperion-${{ steps.version.outputs.version }}.tgz
        run: |
          if [ ! -f "$TARBALL" ] || [ ! -f "$TARBALL.sha256" ]; then
            echo "::error::the package artifact holds no $TARBALL and its sha256; nothing is published"
            exit 1
          fi
          tested=$(cut -d' ' -f1 "$TARBALL.sha256")
          actual=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          echo "tested  sha256 $tested (Tests run $RUN_ID)"
          echo "publish sha256 $actual"
          if [ "$actual" != "$tested" ]; then
            echo "::error::$TARBALL differs from the tarball the Tests run tested; nothing is published"
            exit 1
          fi

      # The shared npm setup comes from this workflow's own revision, since the
      # tested commit may predate it.
      - if: steps.version.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-workflow
          sparse-checkout: .github/actions/npm-publisher

      - if: steps.version.outputs.publish == 'true'
        uses: ./.release-workflow/.github/actions/npm-publisher

      - if: steps.version.outputs.publish == 'true' && steps.version.outputs.tagged != 'true'
        name: Tag the tested commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "telperion ${TAG#v}" "$HEAD_SHA"
          git push origin "refs/tags/$TAG"

      - if: steps.version.outputs.publish == 'true'
        name: Publish the tested tarball to npm with provenance
        working-directory: ${{ runner.temp }}/package
        env:
          TARBALL: telperion-${{ steps.version.outputs.version }}.tgz
        run: npm publish --provenance --access public "./$TARBALL"

  # The prerelease: the dispatched commit, built as the Tests package job
  # builds it, published under next. A version without -next., a tag other
  # than next, or a version already on npm refuses before anything is
  # published.
  prerelease:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'DanielKillenberger/telperion'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      DIST_TAG: next
    steps:
      # The dispatched commit, so the provenance names the commit built.
      - uses: actions/checkout@v7

      # Outside a pull request the size check holds the ceilings only.
      - uses: ./.github/actions/package

      - uses: ./.github/actions/npm-publisher

      - name: Set the prerelease version
        run: |
          base=$(node -p 'require("./package.json").version')
          version="$base-next.$(date -u +%Y%m%d).$(git rev-parse --short=7 HEAD)"
          npm version --no-git-tag-version "$version"
          # npm rewrites an all-digit short sha with a leading zero (not
          # semver) rather than refusing it, which would name another commit.
          written=$(node -p 'require("./package.json").version')
          if [ "$written" != "$version" ]; then
            echo "::error::npm wrote version $written for $version, which is not valid semver; nothing is published"
            exit 1
          fi

      - name: Refuse a version that is not a next prerelease or is already on npm
        run: |
          version=$(node -p 'require("./package.json").version')
          case "$version" in
            *-next.*) ;;
            *) echo "::error::version $version has no -next. suffix; a prerelease never publishes it"; exit 1 ;;
          esac
          if [ "$DIST_TAG" != next ]; then
            echo "::error::dist-tag $DIST_TAG is not next; a prerelease publishes under next only"
            exit 1
          fi
          versions=$(npm view telperion versions --json)
          on_npm=$(node -p '[].concat(JSON.parse(process.argv[1])).includes(process.argv[2])' "$versions" "$version")
          if [ "$on_npm" = true ]; then
            echo "::error::telperion@$version is already on npm; a rerun at the same commit on the same day publishes nothing"
            exit 1
          fi

      - id: pack
        name: Pack the tarball and list its files
        run: |
          npm pack --json > "$RUNNER_TEMP/pack.json"
          tarball=$(jq -r '.[0].filename' "$RUNNER_TEMP/pack.json")
          jq -r '.[0].files[].path' "$RUNNER_TEMP/pack.json"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish the tarball under next with provenance
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--tag "$DIST_TAG" --provenance --access public)
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          npm publish "${args[@]}" "./$TARBALL"
