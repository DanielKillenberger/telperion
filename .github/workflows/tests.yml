name: Tests

# A push or pull request that touches only flow bookkeeping, documentation or
# markdown starts no run. The paths listed after the exclusions are test inputs
# that live under those trees: the species profiles and the benchmark protocol
# the core tests read, the spec the citation parser is tested on, and the
# catalogue, whose generated pages are markdown the structure check gates.
#
# This workflow is also the release. Every run builds the package once and
# tests that tarball; a push to master whose package.json version is not on
# npm yet publishes that tarball once every suite is green for the commit, by
# receipt or by run, and then tags the commit v<version>. Nothing else
# publishes.
on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!.flow/**'
      - '!docs/**'
      - '!**.md'
      - '.flow/evidence/fn9/profiles.json'
      - '.flow/evidence/fn34/profiles.json'
      - '.flow/evidence/fn19/protocol.json'
      - '.flow/specs/fn-11-growth-over-time.md'
      - 'catalogue/**'
  pull_request:
    paths:
      - '**'
      - '!.flow/**'
      - '!docs/**'
      - '!**.md'
      - '.flow/evidence/fn9/profiles.json'
      - '.flow/evidence/fn34/profiles.json'
      - '.flow/evidence/fn19/protocol.json'
      - '.flow/specs/fn-11-growth-over-time.md'
      - 'catalogue/**'

# A pull request's newer push cancels its older run. Master's runs queue
# instead, so a publish is never cancelled between its upload and its tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each suite's key is a hash of its inputs (scripts/ci-key.mjs); a green run
  # saved a receipt under the key, and a receipt found here skips the suite.
  # GitHub restores a cache from the same branch or from master, so a pull
  # request reads master's receipts and master writes its own.
  receipts:
    runs-on: ubuntu-latest
    # A lookup that misses leaves cache-hit empty, and an empty field collapses
    # where a consumer splits on whitespace, so each hit is published as the
    # literal true or false.
    outputs:
      rust-core: ${{ steps.rust-core.outputs.cache-hit == 'true' }}
      rust-render: ${{ steps.rust-render.outputs.cache-hit == 'true' }}
      rust-wasm: ${{ steps.rust-wasm.outputs.cache-hit == 'true' }}
      rust-jev: ${{ steps.rust-jev.outputs.cache-hit == 'true' }}
      node: ${{ steps.node.outputs.cache-hit == 'true' }}
      rust-all: ${{ steps.rust-core.outputs.cache-hit == 'true' && steps.rust-render.outputs.cache-hit == 'true' && steps.rust-wasm.outputs.cache-hit == 'true' && steps.rust-jev.outputs.cache-hit == 'true' }}
      rust-core-key: ${{ steps.keys.outputs.rust-core }}
      rust-render-key: ${{ steps.keys.outputs.rust-render }}
      rust-wasm-key: ${{ steps.keys.outputs.rust-wasm }}
      rust-jev-key: ${{ steps.keys.outputs.rust-jev }}
      node-key: ${{ steps.keys.outputs.node }}
    steps:
      - uses: actions/checkout@v7

      - id: keys
        name: Compute the receipt keys
        run: |
          for suite in rust-core rust-render rust-wasm rust-jev node; do
            echo "$suite=$(node scripts/ci-key.mjs "$suite")" >> "$GITHUB_OUTPUT"
          done

      - id: rust-core
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-core
          key: ${{ steps.keys.outputs.rust-core }}
          lookup-only: true
      - id: rust-render
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-render
          key: ${{ steps.keys.outputs.rust-render }}
          lookup-only: true
      - id: rust-wasm
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-wasm
          key: ${{ steps.keys.outputs.rust-wasm }}
          lookup-only: true
      - id: rust-jev
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-jev
          key: ${{ steps.keys.outputs.rust-jev }}
          lookup-only: true
      - id: node
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/receipts/node
          key: ${{ steps.keys.outputs.node }}
          lookup-only: true

      - name: Report the receipts
        env:
          RECEIPTS: |-
            rust-core ${{ steps.keys.outputs.rust-core }} ${{ steps.rust-core.outputs.cache-hit == 'true' }}
            rust-render ${{ steps.keys.outputs.rust-render }} ${{ steps.rust-render.outputs.cache-hit == 'true' }}
            rust-wasm ${{ steps.keys.outputs.rust-wasm }} ${{ steps.rust-wasm.outputs.cache-hit == 'true' }}
            rust-jev ${{ steps.keys.outputs.rust-jev }} ${{ steps.rust-jev.outputs.cache-hit == 'true' }}
            node ${{ steps.keys.outputs.node }} ${{ steps.node.outputs.cache-hit == 'true' }}
        run: |
          while read -r suite key hit; do
            case $hit in
              true) echo "$suite: receipt $key found, the suite is skipped." ;;
              *) echo "$suite: receipt $key missing, the suite runs." ;;
            esac
          done <<< "$RECEIPTS"

  # Each Rust crate without a receipt runs under cargo-nextest on standard
  # runners (.github/actions/nextest): the core crate as four count partitions
  # of its tests, chosen from the runner's per-test times, the render crate
  # whole, and the two small crates together. A crate's receipt is saved in
  # rust-receipts when every job of that crate is green.
  core:
    name: core ${{ matrix.partition }}/4
    needs: receipts
    if: needs.receipts.outputs.rust-core != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nextest
        with:
          packages: telperion-core
          partition: count:${{ matrix.partition }}/4

  # The leaf plan and the field build with the wood surface and the leaf
  # placement compiled out (the core crate without its geometry feature), and
  # the crate's unit tests run in that configuration.
  core-plan:
    name: core without geometry
    needs: receipts
    if: needs.receipts.outputs.rust-core != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build and unit-test the core without geometry
        run: |
          cargo build --profile ci -p telperion-core --no-default-features
          cargo test --profile ci -p telperion-core --no-default-features --lib

  render:
    needs: receipts
    if: needs.receipts.outputs.rust-render != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nextest
        with:
          packages: telperion-render

  wasm-jev:
    name: wasm, field and jev
    needs: receipts
    if: needs.receipts.outputs.rust-wasm != 'true' || needs.receipts.outputs.rust-jev != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/nextest
        with:
          packages: >-
            ${{ needs.receipts.outputs.rust-wasm != 'true' && 'telperion-wasm telperion-field' || '' }}
            ${{ needs.receipts.outputs.rust-jev != 'true' && 'telperion-jev' || '' }}

  # Reached whatever the crate jobs did; a crate's receipt is written only
  # when its jobs succeeded and it had none, so a red crate saves nothing.
  rust-receipts:
    needs: [receipts, core, core-plan, render, wasm-jev]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Write the receipts of the crates whose jobs were green
        env:
          RECEIPTS: |-
            rust-core ${{ needs.receipts.outputs.rust-core-key }} ${{ needs.receipts.outputs.rust-core }} ${{ needs.core.result == 'success' && needs.core-plan.result == 'success' && 'success' || 'failure' }}
            rust-render ${{ needs.receipts.outputs.rust-render-key }} ${{ needs.receipts.outputs.rust-render }} ${{ needs.render.result }}
            rust-wasm ${{ needs.receipts.outputs.rust-wasm-key }} ${{ needs.receipts.outputs.rust-wasm }} ${{ needs.wasm-jev.result }}
            rust-jev ${{ needs.receipts.outputs.rust-jev-key }} ${{ needs.receipts.outputs.rust-jev }} ${{ needs.wasm-jev.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          while read -r suite key hit result; do
            if [ "$hit" != true ] && [ "$result" = success ]; then
              echo "$key" > "$RUNNER_TEMP/receipts/$suite"
              echo "$suite: green, receipt $key written."
            else
              echo "$suite: receipt $hit, jobs $result, nothing written."
            fi
          done <<< "$RECEIPTS"

      - if: needs.receipts.outputs.rust-core != 'true' && needs.core.result == 'success' && needs.core-plan.result == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-core
          key: ${{ needs.receipts.outputs.rust-core-key }}
      - if: needs.receipts.outputs.rust-render != 'true' && needs.render.result == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-render
          key: ${{ needs.receipts.outputs.rust-render-key }}
      - if: needs.receipts.outputs.rust-wasm != 'true' && needs.wasm-jev.result == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-wasm
          key: ${{ needs.receipts.outputs.rust-wasm-key }}
      - if: needs.receipts.outputs.rust-jev != 'true' && needs.wasm-jev.result == 'success'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-jev
          key: ${{ needs.receipts.outputs.rust-jev-key }}

  node:
    needs: receipts
    if: needs.receipts.outputs.node != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: ./.github/actions/wasm-bindgen

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/suite
        with:
          suite: node
          key: ${{ needs.receipts.outputs.node-key }}
          hit: ${{ needs.receipts.outputs.node }}
          run: |
            npm test
            npm run typecheck

  # The package, built once per commit. Its tarball is what the tests below
  # load and what the release publishes: test:dist runs on the dist unpacked
  # from the tarball, and the tarball is uploaded with its sha256.
  package:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: ./.github/actions/wasm-bindgen

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - name: Build the package
        run: npm run build

      - id: pack
        name: Pack the tarball
        run: |
          tarball=$(npm pack --json | jq -r '.[0].filename')
          sha256=$(sha256sum "$tarball" | cut -d' ' -f1)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "$tarball sha256 $sha256"

      - name: Load the tarball's entries in Node with no Wasm source given
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          rm -rf dist
          tar -xzf "$TARBALL" --strip-components=1 package/dist
          npm run test:dist

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  # A push to master publishes when its package.json version is new: every
  # suite green for this commit by receipt or by run, the tarball the package
  # job tested published unchanged, then the commit tagged. A version already
  # on npm publishes nothing; a version below npm's latest, a tag that names
  # another commit, a suite neither receipted nor green, and a missing or
  # altered tarball each refuse before anything is uploaded. The publish
  # authenticates by npm trusted publishing: the workflow's OIDC token
  # (id-token: write, npm 11.5.1 or later, Node 22.14 or later) under the
  # trusted publisher configured on npmjs.com for this repository and this
  # workflow file. No npm token is stored or set. Provenance binds the tarball
  # to this commit and this run.
  publish:
    needs: [receipts, core, core-plan, render, wasm-jev, node, package]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Decide whether this commit publishes
        run: |
          version=$(node -p 'require("./package.json").version')
          tag="v$version"
          versions=$(npm view telperion versions --json)
          latest=$(npm view telperion dist-tags.latest)
          on_npm=$(node -p '[].concat(JSON.parse(process.argv[1])).includes(process.argv[2])' "$versions" "$version")
          tagged=$(git ls-remote --tags origin | awk -v t="refs/tags/$tag" '$2 == t "^{}" { p = $1 } $2 == t { l = $1 } END { print p ? p : l }')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$on_npm" = true ]; then
            echo "$version is already on npm; nothing is published."
            [ -n "$tagged" ] || echo "::warning::$version is on npm but no $tag tag exists; tag its commit by hand."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$latest" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "::error::$version is lower than npm's latest $latest; nothing is published"
            exit 1
          fi
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::$tag already names $tagged, not $GITHUB_SHA; nothing is published"
            exit 1
          fi
          echo "$version is new (npm's latest is $latest); this commit publishes it."
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "tagged=${tagged:+true}" >> "$GITHUB_OUTPUT"

      # A suite is green for this commit when its receipt matched the commit's
      # inputs or its jobs ran green here. There is no fallback run.
      - if: steps.version.outputs.publish == 'true'
        name: Every suite is green for this commit
        env:
          SUITES: |-
            rust-core ${{ needs.receipts.outputs.rust-core }} ${{ needs.core.result == 'success' && needs.core-plan.result == 'success' && 'success' || 'failure' }}
            rust-render ${{ needs.receipts.outputs.rust-render }} ${{ needs.render.result }}
            rust-wasm ${{ needs.receipts.outputs.rust-wasm }} ${{ needs.wasm-jev.result }}
            rust-jev ${{ needs.receipts.outputs.rust-jev }} ${{ needs.wasm-jev.result }}
            node ${{ needs.receipts.outputs.node }} ${{ needs.node.result }}
            package false ${{ needs.package.result }}
        run: |
          refused=0
          while read -r suite hit result; do
            if [ "$hit" = true ]; then
              echo "$suite: green by receipt."
            elif [ "$result" = success ]; then
              echo "$suite: green by run."
            else
              echo "::error::$suite has no receipt for this commit and its run is ${result:-missing}; nothing is published"
              refused=1
            fi
          done <<< "$SUITES"
          exit "$refused"

      - if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package

      - if: steps.version.outputs.publish == 'true'
        name: The tarball is the one the package job tested
        env:
          TARBALL: ${{ runner.temp }}/package/${{ needs.package.outputs.tarball }}
          TESTED: ${{ needs.package.outputs.sha256 }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ "$(basename "$TARBALL")" = "telperion-$VERSION.tgz" ] || { echo "::error::the tested tarball is not telperion-$VERSION.tgz; nothing is published"; exit 1; }
          [ -f "$TARBALL" ] || { echo "::error::the package artifact holds no $(basename "$TARBALL"); nothing is published"; exit 1; }
          actual=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          echo "tested  sha256 $TESTED"
          echo "publish sha256 $actual"
          [ "$actual" = "$TESTED" ] || { echo "::error::the tarball differs from the one CI tested; nothing is published"; exit 1; }

      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; the npm a Node release
      # bundles may be older.
      - if: steps.version.outputs.publish == 'true'
        name: Install an npm that publishes through a trusted publisher
        run: npm install -g npm@^11.5.1 && npm --version

      - if: steps.version.outputs.publish == 'true'
        name: Publish the tested tarball to npm with provenance
        env:
          TARBALL: ${{ runner.temp }}/package/${{ needs.package.outputs.tarball }}
        run: npm publish --provenance --access public "$TARBALL"

      - if: steps.version.outputs.publish == 'true' && steps.version.outputs.tagged != 'true'
        name: Tag the published commit
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "telperion ${TAG#v}" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
