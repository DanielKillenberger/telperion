name: Tests

# A push or pull request that touches only flow bookkeeping, documentation or
# markdown starts no run. The four files listed after the exclusions are test
# inputs that live under those trees: the species profiles and the benchmark
# protocol the core tests read, and the spec the citation parser is tested on.
on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!.flow/**'
      - '!docs/**'
      - '!**.md'
      - '.flow/evidence/fn9/profiles.json'
      - '.flow/evidence/fn34/profiles.json'
      - '.flow/evidence/fn19/protocol.json'
      - '.flow/specs/fn-11-growth-over-time.md'
  pull_request:
    paths:
      - '**'
      - '!.flow/**'
      - '!docs/**'
      - '!**.md'
      - '.flow/evidence/fn9/profiles.json'
      - '.flow/evidence/fn34/profiles.json'
      - '.flow/evidence/fn19/protocol.json'
      - '.flow/specs/fn-11-growth-over-time.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Each suite's key is a hash of its inputs (scripts/ci-key.mjs); a green run
  # saved a receipt under the key, and a receipt found here skips the suite.
  # GitHub restores a cache from the same branch or from master, so a pull
  # request reads master's receipts and master writes its own.
  receipts:
    runs-on: ubuntu-latest
    outputs:
      rust-core: ${{ steps.rust-core.outputs.cache-hit }}
      rust-render: ${{ steps.rust-render.outputs.cache-hit }}
      rust-wasm: ${{ steps.rust-wasm.outputs.cache-hit }}
      rust-jev: ${{ steps.rust-jev.outputs.cache-hit }}
      node: ${{ steps.node.outputs.cache-hit }}
      rust-all: ${{ steps.rust-core.outputs.cache-hit == 'true' && steps.rust-render.outputs.cache-hit == 'true' && steps.rust-wasm.outputs.cache-hit == 'true' && steps.rust-jev.outputs.cache-hit == 'true' }}
      rust-core-key: ${{ steps.keys.outputs.rust-core }}
      rust-render-key: ${{ steps.keys.outputs.rust-render }}
      rust-wasm-key: ${{ steps.keys.outputs.rust-wasm }}
      rust-jev-key: ${{ steps.keys.outputs.rust-jev }}
      node-key: ${{ steps.keys.outputs.node }}
    steps:
      - uses: actions/checkout@v7

      - id: keys
        name: Compute the receipt keys
        run: |
          for suite in rust-core rust-render rust-wasm rust-jev node; do
            echo "$suite=$(node scripts/ci-key.mjs "$suite")" >> "$GITHUB_OUTPUT"
          done

      - id: rust-core
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-core
          key: ${{ steps.keys.outputs.rust-core }}
          lookup-only: true
      - id: rust-render
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-render
          key: ${{ steps.keys.outputs.rust-render }}
          lookup-only: true
      - id: rust-wasm
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-wasm
          key: ${{ steps.keys.outputs.rust-wasm }}
          lookup-only: true
      - id: rust-jev
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-jev
          key: ${{ steps.keys.outputs.rust-jev }}
          lookup-only: true
      - id: node
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/receipts/node
          key: ${{ steps.keys.outputs.node }}
          lookup-only: true

      - name: Report the receipts
        env:
          RECEIPTS: |-
            rust-core ${{ steps.keys.outputs.rust-core }} ${{ steps.rust-core.outputs.cache-hit }}
            rust-render ${{ steps.keys.outputs.rust-render }} ${{ steps.rust-render.outputs.cache-hit }}
            rust-wasm ${{ steps.keys.outputs.rust-wasm }} ${{ steps.rust-wasm.outputs.cache-hit }}
            rust-jev ${{ steps.keys.outputs.rust-jev }} ${{ steps.rust-jev.outputs.cache-hit }}
            node ${{ steps.keys.outputs.node }} ${{ steps.node.outputs.cache-hit }}
        run: |
          while read -r suite key hit; do
            case $hit in
              true) echo "$suite: receipt $key found, the suite is skipped." ;;
              *) echo "$suite: receipt $key missing, the suite runs." ;;
            esac
          done <<< "$RECEIPTS"

  # The Rust suites without a receipt run as one nextest pool partitioned
  # across standard runners; nextest is installed from its prebuilt binary at
  # a pin. A partition is a slice of the tests of every crate, so a crate's
  # receipt is saved only after every partition is green, in rust-receipts.
  rust:
    needs: receipts
    if: needs.receipts.outputs.rust-all != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      # rustup reads the channel, profile, components and targets from
      # rust-toolchain.toml; the workflow names none of them.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-nextest at its pin
        run: curl -LsSf https://get.nexte.st/0.9.145/linux | tar zxf - -C "$HOME/.cargo/bin"

      # The ci profile is release without the fat link (Cargo.toml); every
      # package script and local command stays on release.
      - name: Run partition ${{ matrix.partition }} of the suites without a receipt
        env:
          SUITES: |-
            rust-core telperion-core ${{ needs.receipts.outputs.rust-core }}
            rust-render telperion-render ${{ needs.receipts.outputs.rust-render }}
            rust-wasm telperion-wasm ${{ needs.receipts.outputs.rust-wasm }}
            rust-jev telperion-jev ${{ needs.receipts.outputs.rust-jev }}
        run: |
          packages=()
          while read -r suite package hit; do
            case $hit in
              true) echo "Skipped $suite: receipt matched." ;;
              *) packages+=(-p "$package") ;;
            esac
          done <<< "$SUITES"
          cargo nextest run --cargo-profile ci "${packages[@]}" --no-fail-fast \
            --partition count:${{ matrix.partition }}/4

      # The fixed-specimen cache the core tests write is a per-run scratch and
      # stays out of the build cache saved after this step.
      - name: Leave the specimen cache out of the build cache
        if: always()
        run: rm -rf target/tmp/specimens

  rust-receipts:
    needs: [receipts, rust]
    if: needs.rust.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Write the receipts of the suites that ran
        env:
          RECEIPTS: |-
            rust-core ${{ needs.receipts.outputs.rust-core-key }} ${{ needs.receipts.outputs.rust-core }}
            rust-render ${{ needs.receipts.outputs.rust-render-key }} ${{ needs.receipts.outputs.rust-render }}
            rust-wasm ${{ needs.receipts.outputs.rust-wasm-key }} ${{ needs.receipts.outputs.rust-wasm }}
            rust-jev ${{ needs.receipts.outputs.rust-jev-key }} ${{ needs.receipts.outputs.rust-jev }}
        run: |
          mkdir -p "$RUNNER_TEMP/receipts"
          while read -r suite key hit; do
            [ "$hit" = true ] || echo "$key" > "$RUNNER_TEMP/receipts/$suite"
          done <<< "$RECEIPTS"

      - if: needs.receipts.outputs.rust-core != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-core
          key: ${{ needs.receipts.outputs.rust-core-key }}
      - if: needs.receipts.outputs.rust-render != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-render
          key: ${{ needs.receipts.outputs.rust-render-key }}
      - if: needs.receipts.outputs.rust-wasm != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-wasm
          key: ${{ needs.receipts.outputs.rust-wasm-key }}
      - if: needs.receipts.outputs.rust-jev != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/receipts/rust-jev
          key: ${{ needs.receipts.outputs.rust-jev-key }}

  node:
    needs: receipts
    if: needs.receipts.outputs.node != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The version Cargo.lock pins for the wasm-bindgen crate; render:build
      # refuses any other CLI. The binary is restored by the cache above.
      - name: Install wasm-bindgen-cli at the crate's pin
        run: cargo install wasm-bindgen-cli --version "$(cargo pkgid wasm-bindgen | sed 's/.*@//')"

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/suite
        with:
          suite: node
          key: ${{ needs.receipts.outputs.node-key }}
          hit: ${{ needs.receipts.outputs.node }}
          run: |
            npm test
            npm run typecheck
