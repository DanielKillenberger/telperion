<!doctype html><meta charset="utf-8"><title>fn91 - Lit wood comparison</title>
<style>body{margin:24px;background:#202124;color:#f1f3f4;font:18px system-ui}button,a{font:inherit;padding:8px 16px;margin-right:8px}button{cursor:pointer}a{color:#9bd}#stage{position:relative;width:min(100%,1500px);line-height:0}img{width:100%}#gpu{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}input{width:min(80%,1000px)}p{max-width:1000px}#line{position:absolute;left:50%;top:0;bottom:0;border-left:2px solid white}</style>
<h1>Wood comparison in bright light</h1><p>Full tree, outside the canopy. Foliage is hidden in both images to expose the wood. Matching camera and lighting; original generated geometry.</p>
<p><button onclick="species='oregon-white-oak';load()">Oak</button><button onclick="species='norway-spruce';load()">Spruce</button><button onclick="set(0)">CPU only</button><button onclick="set(100)">GPU only</button><button onclick="set(50)">Split</button></p>
<p id="label"></p><input id="range" type="range" value="50" min="0" max="100" oninput="set(this.value)" aria-label="GPU image coverage"><div id="stage"><img id="cpu"><img id="gpu"><div id="line"></div></div><p><a id="cpuLink" target="_blank">Open CPU full size</a><a id="gpuLink" target="_blank">Open GPU full size</a></p>
<script>let species='oregon-white-oak';const cpu=document.getElementById('cpu'),gpu=document.getElementById('gpu');function load(){cpu.src='wood-detail-'+species+'-cpu.png';gpu.src='wood-detail-'+species+'-gpu.png';document.getElementById('cpuLink').href=cpu.src;document.getElementById('gpuLink').href=gpu.src;set(document.getElementById('range').value)}function set(v){document.getElementById('range').value=v;gpu.style.clipPath='inset(0 '+(100-v)+'% 0 0)';document.getElementById('line').style.left=v+'%';document.getElementById('label').textContent=species+' • '+(v==0?'CPU':v==100?'GPU':'GPU left / CPU right')}load();</script>
